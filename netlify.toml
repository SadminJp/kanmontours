[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Clean URL for the schedules API. GET is public (the booking calendar
# needs it); POST requires the ADMIN_PASSWORD env var — see
# netlify/functions/schedules.ts.
[[redirects]]
  from = "/api/schedules"
  to = "/.netlify/functions/schedules"
  status = 200

# Clean URL for the admin-configurable notification email. Both GET and POST
# require the ADMIN_PASSWORD env var; POST also needs NETLIFY_API_TOKEN to
# apply the change — see netlify/functions/settings.ts.
[[redirects]]
  from = "/api/settings"
  to = "/.netlify/functions/settings"
  status = 200
