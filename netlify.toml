[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Clean URL for the schedules API. GET is public (the booking calendar
# needs it); POST requires the ADMIN_PASSWORD env var — see
# netlify/functions/schedules.ts.
[[redirects]]
  from = "/api/schedules"
  to = "/.netlify/functions/schedules"
  status = 200

# Clean URL for the admin-configurable notification email. Both GET and POST
# require the ADMIN_PASSWORD env var; POST also needs NETLIFY_API_TOKEN to
# apply the change — see netlify/functions/settings.ts.
[[redirects]]
  from = "/api/settings"
  to = "/.netlify/functions/settings"
  status = 200

# Clean URL for the editable tour content. Both GET and POST require the
# ADMIN_PASSWORD env var — unlike schedules, nothing here is public, since the
# same content is already served as HTML — see netlify/functions/tour-content.ts.
[[redirects]]
  from = "/api/tour-content"
  to = "/.netlify/functions/tour-content"
  status = 200

# Uploading a photo from the admin page. Requires the ADMIN_PASSWORD env var.
[[redirects]]
  from = "/api/tour-images"
  to = "/.netlify/functions/tour-images"
  status = 200

# Serving those photos. Public, like any other page image, and cached
# indefinitely because an uploaded key's bytes never change. This must come
# after the /api rule above so the upload endpoint keeps its own path.
[[redirects]]
  from = "/images/tours/uploaded/*"
  to = "/.netlify/functions/tour-images?key=:splat"
  status = 200
